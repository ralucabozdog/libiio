include: iio,iio-device.yaml

description: IIO ADC/DAC io-channels

compatible: "iio,io-channels"

properties:
  io-channels:
    required: true

  io-channel-names:
    required: true

  io-name:
    type: string
    description: |
      The device name for use within IIOD. If not set, the device's node will be used
      as a fallback.

  buffer-name:
    type: string
    description: |
      Name of the buffer attribute for this IIO device.
      If not specified, defaults to "buffer".

  trigger-device:
    type: phandle
    description: |
      Phandle to the IIO trigger device node that this device is associated with.

child-binding:
  description: |
    Trigger node nested inside the IIO io-channels node. Must use a compatible
    iio,trigger-io-channels-stream.
    The trigger child node is identified at build time by the presence of the
    'trigger-id' property and may have any node name (e.g. trigger, trigger0,
    trigger_stream0).
    When this child node is present, the 'trigger-device' property of the parent
    node must not be specified.  I/O channels nodes can represent ADC or DAC
    devices, but stream trigger can be used ONLY FOR ADC DEVICES.
