include: base.yaml

description: IIO sensor

compatible: "iio,sensor"

properties:
  reg:
    required: true

  sensor-device:
    type: phandle
    required: true

  sensor-channels:
    type: array
    required: true

  buffer-name:
    type: string
    description: |
      Name of the buffer attribute for this IIO device.
      If not specified, defaults to "buffer".

  trigger-device:
    type: phandle
    description: |
      Phandle to the IIO trigger device node that this device is associated with.
