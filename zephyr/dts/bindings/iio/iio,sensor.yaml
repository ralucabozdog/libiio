include:
  - base.yaml
  - iio,trigger.yaml

description: IIO sensor

compatible: "iio,sensor"

properties:
  reg:
    required: true

  sensor-device:
    type: phandle
    required: true

  sensor-channels:
    type: array
    required: true

  buffer-name:
    type: string
    description: |
      Name of the buffer attribute for this IIO device.
      If not specified, defaults to "buffer".
