description: IIO trigger binding

properties:
  trigger-id:
    type: string
    description: |
      ID of the trigger. Must start with "trigger".
  trigger-type:
    type: string
    enum:
      - "timer"
      - "zephyr-common"
      - "zephyr-stream"
    description: |
      Type of trigger mechanism to use.
      - "timer": software timer-based trigger
      - "zephyr-common": Zephyr common sensor trigger API
      - "zephyr-stream": Zephyr streaming (RTIO) API
