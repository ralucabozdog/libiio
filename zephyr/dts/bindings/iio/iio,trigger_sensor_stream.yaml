include: iio,trigger.yaml

description: IIO sensor stream trigger binding

compatible: "iio,trigger-sensor-stream"

properties:
  sensor-stream-channels:
    type: array
    required: true
    description: |
      Array of sensor channel identifiers specifying which channels to include
      in the RTIO sensor stream. Use the IIO_SENSOR_CHAN_* constants defined in
      <dt-bindings/iio/sensor-channels.h> (e.g. IIO_SENSOR_CHAN_ACCEL_X,
      IIO_SENSOR_CHAN_ACCEL_Y, IIO_SENSOR_CHAN_ACCEL_Z).
