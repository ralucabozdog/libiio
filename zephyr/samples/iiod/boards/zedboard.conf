# Zedboard has no hardware entropy source
CONFIG_TEST_RANDOM_GENERATOR=y

# GEM Ethernet requires L2 to be enabled; without it the driver is never built
# and the static IP from iiod-network binds to nothing (EADDRNOTAVAIL)
CONFIG_NET_L2_ETHERNET=y
CONFIG_MDIO=y

# Block in net_config_init() until the interface has a valid IPv4 address
CONFIG_NET_CONFIG_NEED_IPV4=y

# AXI offload stack required by the AD463x driver
CONFIG_SPI=y
CONFIG_SPI_ADI_AXI_SPI_ENGINE=y
CONFIG_DMA=y
CONFIG_DMA_ADI_AXI_DMAC=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_ADI_AXI_CLKGEN=y
CONFIG_PWM=y
CONFIG_PWM_ADI_AXI_PWMGEN=y
CONFIG_EEPROM=y
CONFIG_EEPROM_ADI_AXI_SYSID=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_ADC_AD463X=y

# AD463x uses its own DMA bulk path — ADC_STREAM / RTIO not needed
CONFIG_ADC_STREAM=n

# DMA buffers must be non-cacheable with PL310 L2 enabled
CONFIG_NOCACHE_MEMORY=y

# Raise the malloc arena so iiod capture blocks (malloc'd) are not capped at
# the 16 KiB default (~730 samples). 1 MiB gives comfortable headroom in
# cacheable DDR without touching the __nocache region used by Ethernet DMA
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576

# TCP window tuning: widen send/recv windows and back them with more net
# buffers so multiple capture blocks can be in flight simultaneously
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=65535
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=65535
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_BUF_RX_COUNT=128

# Full Ethernet MTU instead of the 576-byte IPv4 minimum to reduce per-packet
# stack overhead (~1460-byte TCP payload vs ~536)
CONFIG_NET_IPV4_MTU=1500

# Fit a full 1500-byte frame in a single net buffer; 1536 adds headroom
CONFIG_NET_BUF_DATA_SIZE=1536

# Client thread stack must be large enough for readbuf + DMA scratch
CONFIG_LIBIIO_IIOD_NETWORK_CLIENT_THREAD_STACK_SIZE=16384
