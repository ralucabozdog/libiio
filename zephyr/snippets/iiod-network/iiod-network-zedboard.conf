# Zedboard-specific overrides for the iiod-network snippet.
# Applied after iiod-network.conf so these values always win on this board.

# Full Ethernet MTU to avoid IP fragmentation on GEM
CONFIG_NET_IPV4_MTU=1500

# Packet/buffer pool large enough for concurrent capture + XML responses
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_PKT_RX_COUNT=128

# Widen TCP send window so multiple blocks can be in flight
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=65535
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=65535

# malloc arena for iiod capture blocks (1 MiB in cacheable DDR)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576

# Client threads need stack space for DMA scratch + readbuf
CONFIG_LIBIIO_IIOD_NETWORK_CLIENT_THREAD_STACK_SIZE=16384
CONFIG_LIBIIO_IIOD_NETWORK_CLIENT_MAX=6
