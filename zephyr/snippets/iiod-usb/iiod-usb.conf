CONFIG_LIBIIO=y
CONFIG_LIBIIO_IIOD_USB=y

CONFIG_IIOD_USBD_VID=0x0456
CONFIG_IIOD_USBD_PID=0xB673
CONFIG_IIOD_USBD_MANUFACTURER="Analog Devices Inc"
CONFIG_IIOD_USBD_PRODUCT="IIO USB Device"
CONFIG_IIOD_USBD_MAX_POWER=250

CONFIG_POSIX_API=y
CONFIG_STATIC_INIT_GNU=y

# TODO - tbd what is actually needed here, copied from serial so far
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

CONFIG_LOG=y
CONFIG_LIBIIO_LOG_LEVEL_DBG=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_INF=y
CONFIG_UDC_BUF_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096